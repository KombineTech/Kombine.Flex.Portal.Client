name: Dart client checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  dart:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: ['3.6.2', stable]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/Generate-PortalDartClient.py --check
      - name: Analyze, test and check JavaScript precision
        shell: pwsh
        run: ./scripts/Test-PortalDartClient.ps1
